<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ninja Arena</title>
<style>
:root{--bg:#0e0f14;--card:#1a1d27;--ink:#f2f3f7;--mute:#98a0b5;--line:#2b3040;--red:#e8344e;--ok:#2fbf84;--warn:#f0a93b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:900px;margin:0 auto;padding:16px 14px 60px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
h1{margin:0;font-size:1.5rem}h2{font-size:1.1rem;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
label{display:block;font-weight:600;margin:10px 0 4px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:9px 14px;background:var(--red);color:#fff;cursor:pointer}
button.g{background:transparent;border:1px solid var(--line);color:var(--ink)}button.ok{background:var(--ok);color:#06150e}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.mute{color:var(--mute);font-size:.9rem}
.tag{font-size:.8rem;padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
.pending{color:var(--warn);border-color:var(--warn)}.approved{color:var(--ok);border-color:var(--ok)}.rejected{color:var(--red);border-color:var(--red)}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.bracket{display:flex;gap:22px;overflow-x:auto;padding-bottom:8px}
.round{display:flex;flex-direction:column;justify-content:space-around;gap:12px;min-width:220px}
.round h3{margin:0;font-size:.9rem;color:var(--mute)}
.m{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}
.t{padding:2px 0}.t.w{color:var(--ok);font-weight:700}.t.l{color:var(--mute);text-decoration:line-through}
.m input[type=number]{width:56px;padding:6px;display:inline-block}
.champ{text-align:center;font-size:1.3rem;font-weight:700;border:2px solid var(--ok);border-radius:10px;padding:18px;margin-bottom:14px}
table{width:100%;border-collapse:collapse}td,th{padding:7px 6px;border-top:1px solid var(--line);text-align:left}th{color:var(--mute);font-weight:600}
.err{color:#ff6b7f;margin:8px 0 0}
</style>
</head>
<body>
<main><header><h1>Ninja Arena</h1><div id="who"></div></header><div id="app"></div></main>

<script type="module">
/* ===== 1. SETUP ===== */
const firebaseConfig = {apiKey:"AIzaSyCWHx33kP5w0mbgYuEeMMf54kgz28rI4xg",authDomain:"naija-arena-2fcd4.firebaseapp.com",projectId:"naija-arena-2fcd4",appId:"1:126796871055:web:a495df4940691a7664c7fa"};
const PLACE_POINTS = [12,9,8,7,6,5,4,3,2,1];          // points for 1st, 2nd, 3rd... (0 after the list). 1 point per kill is added.
const BR_SPLIT = [50,30,20];                           // % of prize pool for top 3 in battle royale
const OWNER_UID = "PASTE_YOUR_USER_ID_HERE";   // your own account's User UID (Firebase Console > Authentication)
const PAY_INFO = "SmartCash / 9023721750 / OGBONNA CHIMMA BLESSING";   // where players send entry fees (your account)
/* Fixed per game, nobody else can change these. fee = naira per person, size = players per team,
   max = max teams, prizes = naira for 1st, 2nd, 3rd. You keep the rest.
   Free Fire and CODM BR follow your plan. The knockout and 1v1 amounts are placeholders: change them here. */
const GAMES = {
  "Free Fire":{fmt:"br",size:4,max:12,fee:500,prizes:[8000,6000,4000]},
  "CODM Battle Royale":{fmt:"br",size:4,max:25,fee:500,prizes:[16000,12000,8000]},
  "Blood Strike":{fmt:"br",size:4,max:25,fee:500,prizes:[16000,12000,8000]},
  "CODM Multiplayer":{fmt:"ko",size:5,max:8,fee:500,prizes:[8000,4000,0]},
  "Call of Duty":{fmt:"ko",size:2,max:16,fee:500,prizes:[8000,4000,0]},
  "DLS":{fmt:"ko",size:1,max:16,fee:500,prizes:[5000,2000,0]},
  "FC Mobile":{fmt:"ko",size:1,max:16,fee:500,prizes:[5000,2000,0]},
  "eFootball":{fmt:"ko",size:1,max:16,fee:500,prizes:[5000,2000,0]},
  "Chess":{fmt:"ko",size:1,max:16,fee:500,prizes:[5000,2000,0]},
  "Ludo":{fmt:"ko",size:1,max:16,fee:500,prizes:[5000,2000,0]},
  "Other 1v1 game":{fmt:"ko",size:1,max:16,fee:500,prizes:[5000,2000,0]},
  "Other team game":{fmt:"ko",size:4,max:8,fee:500,prizes:[8000,4000,0]}
};
/* ================= */

import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,getDoc,updateDoc,addDoc,writeBatch,onSnapshot,query,orderBy,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const fb=initializeApp(firebaseConfig),auth=getAuth(fb),db=getFirestore(fb);
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tdoc=(...p)=>doc(db,"tournaments",T.id,...p), tcol=n=>collection(db,"tournaments",T.id,n);
let user=null,subs=[],T=null,teams=[],matches=[],results=[],payouts=[],priv=[],myPriv=null,room=null;
const pv=id=>priv.find(p=>p.id===id)||{};
const unsub=()=>{subs.forEach(f=>f());subs=[]};
const isOwner=()=>!!user&&user.uid===OWNER_UID;
const isHost=()=>!!T&&(T.host===user.uid||isOwner());

let profile=null,signingUp=false;
const cleanName=s=>s.trim().toLowerCase();
async function handleAuth(u){
  if(signingUp)return;
  user=u;profile=null;
  if(u){try{const s=await getDoc(doc(db,"users",u.uid));profile=s.exists()?s.data():{username:u.email}}catch(e){profile={username:u.email}}}
  $("who").innerHTML=u?`<span class="mute">@${esc(profile.username)}</span> <button class="g" id="out">Log out</button>`:"";
  if(u)$("out").onclick=()=>signOut(auth);
  u?showList():showAuth();
}
onAuthStateChanged(auth,handleAuth);

function showAuth(mode="login"){unsub();
  const su=mode==="signup";
  $("app").innerHTML=`<div class="card"><h2>${su?"Create your account":"Log in"}</h2>
  ${su?`<label for="em">Email</label><input id="em" type="email" autocomplete="email">`:""}
  <label for="un">Username</label><input id="un" autocomplete="username" ${su?'placeholder="3-20 letters, numbers or _"':""}>
  <label for="pw">Password (6+ characters)</label><input id="pw" type="password" autocomplete="${su?"new-password":"current-password"}">
  <div class="row"><button id="go">${su?"Sign up":"Log in"}</button></div><p class="err" id="er"></p>
  <p class="mute">${su?"Already have an account?":"No account yet?"} <a href="#" id="sw" style="color:var(--red)">${su?"Log in":"Sign up"}</a></p></div>`;
  $("sw").onclick=e=>{e.preventDefault();showAuth(su?"login":"signup")};
  $("go").onclick=su?doSignup:doLogin;}

async function doSignup(){
  const em=$("em").value.trim(),un=$("un").value.trim(),pw=$("pw").value,er=$("er");
  if(!em||!un||!pw){er.textContent="Fill in every box.";return}
  if(!/^[A-Za-z0-9_]{3,20}$/.test(un)){er.textContent="Username must be 3-20 letters, numbers or _ (no spaces).";return}
  try{
    if((await getDoc(doc(db,"usernames",cleanName(un)))).exists()){er.textContent="That username is taken. Pick another.";return}
    signingUp=true;
    const c=await createUserWithEmailAndPassword(auth,em,pw),b=writeBatch(db);
    b.set(doc(db,"users",c.user.uid),{username:un,email:em});
    b.set(doc(db,"usernames",cleanName(un)),{uid:c.user.uid,email:em});
    await b.commit();
    signingUp=false;handleAuth(c.user);
  }catch(e){signingUp=false;const c=e.code||"";
    er.textContent=c==="auth/email-already-in-use"?"An account with this email already exists. Log in instead.":
      c==="auth/weak-password"?"Password must be at least 6 characters.":c==="auth/invalid-email"?"That email does not look right.":"Could not sign up: "+c.replace("auth/","").replace(/-/g," ");}}

async function doLogin(){
  const un=$("un").value.trim(),pw=$("pw").value,er=$("er");
  if(!un||!pw){er.textContent="Enter your username and password.";return}
  try{
    const s=await getDoc(doc(db,"usernames",cleanName(un)));
    if(!s.exists()){er.textContent="No account with that username. Sign up first.";return}
    await signInWithEmailAndPassword(auth,s.data().email,pw);
  }catch(e){const c=e.code||"";
    er.textContent=c==="auth/invalid-credential"||c==="auth/wrong-password"?"Wrong password.":"Could not log in: "+c.replace("auth/","").replace(/-/g," ");}}

/* ---------- List + host a tournament ---------- */
function showList(){unsub();T=null;
  $("app").innerHTML=`<div class="card"><h2>Host a tournament</h2>
  <label for="tn">Name</label><input id="tn" placeholder="Friday Night Cup">
  <label for="tg">Game</label><select id="tg">${Object.keys(GAMES).map(g=>`<option>${g}</option>`).join("")}</select>
  <p class="mute" id="gi"></p>
  <label for="tgm">Matches (battle royale only)</label><input id="tgm" type="number" min="1" value="3">
  <label for="tst">Start date and time</label><input id="tst" type="datetime-local">
  <div class="row"><button id="mk">Create tournament</button></div><p class="err" id="er"></p></div>
  <div class="card"><h2>Open tournaments</h2><div id="tl2" class="mute">Loading...</div></div>`;
  const info=()=>{const g=GAMES[$("tg").value];$("gi").textContent=`${g.fmt==="br"?"Battle royale":"Knockout"} | ${g.size} per team | ${g.fee} naira per person | up to ${g.max} teams`};
  $("tg").onchange=info;info();
  $("mk").onclick=async()=>{const n=$("tn").value.trim();if(!n){$("er").textContent="Enter a tournament name.";return}
    const g=GAMES[$("tg").value];
    await addDoc(collection(db,"tournaments"),{name:n,game:$("tg").value,fmt:g.fmt,fee:g.fee,teamSize:g.size,maxTeams:g.max,games:+$("tgm").value||1,cut:0,startsAt:$("tst").value||"",status:"open",host:user.uid,hostName:profile.username,createdAt:serverTimestamp()});};
  subs.push(onSnapshot(query(collection(db,"tournaments"),orderBy("createdAt","desc")),s=>{
    $("tl2").innerHTML=s.empty?"None yet. Host the first one.":s.docs.map(d=>{const t=d.data();
    return `<div class="item"><div><strong>${esc(t.name)}</strong><br><span class="mute">${esc(t.game)} | ${t.fmt==="br"?"battle royale":"knockout"} | ${t.fee*t.teamSize} naira per team | ${esc(t.status)}</span></div><button data-id="${d.id}">Open</button></div>`}).join("");
    $("tl2").querySelectorAll("button").forEach(b=>b.onclick=()=>openT(b.dataset.id));}));}

function openT(id){unsub();myPriv=null;room=null;
  subs.push(onSnapshot(doc(db,"tournaments",id),s=>{T={id,...s.data()};draw()}));
  [["teams",v=>teams=v],["matches",v=>matches=v],["results",v=>results=v],["payouts",v=>payouts=v],["private",v=>priv=v]].forEach(([n,set])=>
    subs.push(onSnapshot(collection(db,"tournaments",id,n),s=>{set(s.docs.map(d=>({id:d.id,...d.data()})));draw()}, ()=>{})));
  subs.push(onSnapshot(doc(db,"tournaments",id,"private",user.uid),s=>{myPriv=s.exists()?s.data():null;draw()},()=>{}));
  subs.push(onSnapshot(doc(db,"tournaments",id,"room","info"),s=>{room=s.exists()?s.data():null;draw()},()=>{}));}

const approved=()=>teams.filter(t=>t.status==="approved");
const pool=()=>approved().length*T.fee*T.teamSize;

/* ---------- Main screen ---------- */
function draw(){if(!T)return;
  const mine=teams.find(t=>t.id===user.uid),total=T.fee*T.teamSize,host=isHost();
  let h=`<div class="row" style="margin:0 0 10px"><button class="g" id="bk">Back</button></div>
  <div class="card"><h2>${esc(T.name)}</h2><div class="mute">${esc(T.game)} | ${T.fmt==="br"?"battle royale, "+T.games+" matches":"knockout"} | ${T.teamSize} per team | ${total} naira per team | ${esc(T.status)}${T.startsAt?" | starts "+esc(T.startsAt.replace("T"," ")):""}<br>Hosted by ${esc(T.hostName)} | ${isOwner()?"Collected so far: "+pool()+" naira | ":""}Prizes: ${(GAMES[T.game]?.prizes||[]).filter(Boolean).join(" / ")} naira</div></div>`;
  if(T.champion)h+=`<div class="champ">Champion: ${esc(T.champion)}</div>`;

  if(T.status==="open"&&!mine&&approved().length<T.maxTeams)h+=`<div class="card"><h2>Register</h2>
  <p class="mute">Send ${total} naira to: ${esc(PAY_INFO)}<br>Then fill this in. You are the team captain.</p>
  <label for="tm">Team name${T.teamSize===1?" (or your name)":""}</label><input id="tm">
  <label for="cu">Your in-game username (captain)</label><input id="cu">
  ${T.teamSize>1?`<label for="mu">Other players' in-game usernames (comma separated)</label><input id="mu">`:""}
  <label for="pr">Payment reference or sender name</label><input id="pr">
  <label for="po">Where to send your prize (bank name and account number)</label><input id="po">
  <div class="row"><button id="jn">Submit entry</button></div><p class="err" id="er"></p></div>`;
  if(mine)h+=`<div class="card"><h2>Your entry: ${esc(mine.name)}</h2><span class="tag ${mine.status}">${esc(mine.status)}</span>
  <p class="mute">${mine.status==="pending"?"Waiting for the host to confirm your payment.":mine.status==="approved"?"You are in.":"Entry rejected. Contact the host."}</p></div>`;

  if(mine?.status==="approved"&&myPriv)h+=`<div class="card" style="border:2px dashed var(--red)"><h2>Game ticket</h2><div><strong>${esc(T.name)}</strong><br>${esc(T.game)}${T.startsAt?" | "+esc(T.startsAt.replace("T"," ")):""}</div>
  <div class="mute">Team: ${esc(mine.name)} | Captain: ${esc(mine.captain)}<br>Players: ${esc((mine.usernames||[]).join(", "))}<br>Paid: ${total} naira</div>
  <div style="font-size:1.4rem;font-weight:700;margin-top:8px">${esc(myPriv.code)}</div><p class="mute">Screenshot this ticket and keep it. The captain needs it to claim any prize.</p></div>`;
  if(host&&T.status!=="done")h+=`<div class="card"><h2>Game room details</h2><p class="mute">Only approved teams can see these. Add them shortly before the match starts.</p>
  <label for="ri">Room ID</label><input id="ri" value="${esc(room?.id||"")}"><label for="rp">Room password</label><input id="rp" value="${esc(room?.pass||"")}">
  <div class="row"><button id="rs">Save room details</button></div></div>`;
  else if(mine?.status==="approved"&&T.status!=="done")h+=`<div class="card"><h2>Game room</h2>${room?.id?`<p>Room ID: <strong>${esc(room.id)}</strong><br>Password: <strong>${esc(room.pass)}</strong></p><p class="mute">Open the game, go to custom rooms and enter these.</p>`:`<p class="mute">The host will post the room ID and password here shortly before the match.</p>`}</div>`;
  if(host&&T.status==="open")h+=`<div class="card"><h2>Entries (${approved().length} approved)</h2>`+(teams.length?teams.map(t=>`<div class="item"><div><strong>${esc(t.name)}</strong> <span class="tag ${t.status}">${esc(t.status)}</span><br>
  <span class="mute">${esc((t.usernames||[]).join(", "))} ${isOwner()?" | ref: "+esc(pv(t.id).payRef):""}</span></div>${isOwner()?`<div class="row" style="margin:0"><button class="ok" data-a="approved" data-id="${t.id}">Approve</button><button class="g" data-a="rejected" data-id="${t.id}">Reject</button></div>`:""}</div>`).join(""):`<p class="mute">No entries yet.</p>`)+
  `<div class="row"><button id="st">Start tournament</button></div><p class="err" id="er2"></p></div>`;

  if(matches.length)h+=`<div class="card"><div class="bracket">${bracket()}</div></div>`;
  if(isOwner()&&T.fmt==="ko"&&T.status==="live"){const f=matches.find(x=>x.r===T.rounds-1);if(f?.winner)h+=`<div class="card"><button id="fko">Finish tournament and work out the prize</button></div>`}
  if(T.fmt==="br"&&T.status!=="open")h+=brView(mine);
  if(T.status==="done")h+=payView();
  $("app").innerHTML=h;
  $("bk").onclick=showList;
  if($("jn"))$("jn").onclick=join;
  document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>updateDoc(tdoc("teams",b.dataset.id),{status:b.dataset.a}));
  if($("st"))$("st").onclick=start;
  document.querySelectorAll("[data-rep]").forEach(b=>b.onclick=()=>report(b.dataset.rep));
  document.querySelectorAll("[data-win]").forEach(b=>b.onclick=()=>{const[i,s]=b.dataset.win.split("|");resolve(matches.find(m=>m.id===i),s)});
  document.querySelectorAll("[data-ok]").forEach(b=>b.onclick=()=>updateDoc(tdoc("results",b.dataset.ok),{ok:true}));
  document.querySelectorAll("[data-no]").forEach(b=>b.onclick=()=>updateDoc(tdoc("results",b.dataset.no),{ok:false,rejected:true}));
  document.querySelectorAll("[data-paid]").forEach(b=>b.onclick=()=>updateDoc(tdoc("payouts",b.dataset.paid),{paid:true}));
  if($("brs"))$("brs").onclick=submitBR;
  if($("fin"))$("fin").onclick=finishBR;
  if($("fko"))$("fko").onclick=()=>{const f=matches.find(x=>x.r===T.rounds-1);finishKO(f[f.winner],f[f.winner==="a"?"b":"a"])};
  if($("rs"))$("rs").onclick=()=>setDoc(tdoc("room","info"),{id:$("ri").value.trim(),pass:$("rp").value.trim()});
  document.querySelectorAll("[data-vt]").forEach(b=>b.onclick=()=>{const ok=$("vt_"+b.dataset.vt).value.trim().toUpperCase()===(pv(b.dataset.vt).code||"");alert(ok?"Ticket is valid. This is the registered team.":"Ticket does NOT match. Do not pay.")});}

async function join(){
  const name=$("tm").value.trim(),cu=$("cu").value.trim(),pr=$("pr").value.trim(),po=$("po").value.trim();
  if(!name||!cu||!pr||!po){$("er").textContent="Fill in every box.";return}
  const others=T.teamSize>1?$("mu").value.split(",").map(s=>s.trim()).filter(Boolean):[];
  if(others.length+1!==T.teamSize){$("er").textContent=`This game needs ${T.teamSize} usernames in total, including yours.`;return}
  await setDoc(tdoc("teams",user.uid),{name,captain:cu,usernames:[cu,...others],status:"pending"});await setDoc(tdoc("private",user.uid),{payRef:pr,payout:po,code:crypto.randomUUID().slice(0,8).toUpperCase()});}

/* ---------- Screenshot check (reads text in the image, in the browser) ---------- */
async function scan(file,names){
  if(!file)return "no screenshot";
  if(!window.Tesseract)await new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.0/tesseract.min.js";s.onload=ok;s.onerror=no;document.head.appendChild(s)});
  const {data}=await window.Tesseract.recognize(file,"eng"),txt=data.text.toLowerCase().replace(/\s+/g,"");
  const found=names.filter(n=>txt.includes(n.toLowerCase().replace(/\s+/g,"")));
  return `screenshot matched ${found.length} of ${names.length} usernames`;}

/* ---------- Knockout ---------- */
function bracket(){const R={};matches.forEach(m=>(R[m.r]??=[]).push(m));const n=Object.keys(R).length;
  return Object.keys(R).sort((a,b)=>a-b).map(r=>{const left=n-r,nm=left===1?"Final":left===2?"Semi-finals":left===3?"Quarter-finals":"Round "+(+r+1);
  return `<div class="round"><h3>${nm}</h3>${R[r].sort((a,b)=>a.i-b.i).map(card).join("")}</div>`}).join("");}
function card(m){
  const row=s=>`<div class="t ${m.winner===s?"w":m.winner?"l":""}">${m[s]?esc(m[s].name):(m.bye?"Bye":"Waiting...")}</div>`;
  const rep=m.reports||{},play=m.a&&m.b&&!m.winner,my=m.a?.id===user.uid||m.b?.id===user.uid,ra=rep[m.a?.id],rb=rep[m.b?.id];
  const clash=ra&&rb&&(ra.a!==rb.a||ra.b!==rb.b);let x="";
  if(play&&my)x=rep[user.uid]?`<div class="mute">You reported ${rep[user.uid].a}-${rep[user.uid].b} (${esc(rep[user.uid].ocr)}). ${clash?"Scores do not match. The host will decide.":"Waiting for the other team."}</div>`:
    `<div class="row">${esc(m.a.name)} <input id="a_${m.id}" type="number" min="0"> - <input id="b_${m.id}" type="number" min="0"> ${esc(m.b.name)}</div>
     <div class="row"><input id="f_${m.id}" type="file" accept="image/*"><button data-rep="${m.id}">Submit result</button></div>`;
  if(play&&clash&&isHost())x+=`<div class="row"><button class="ok" data-win="${m.id}|a">${esc(m.a.name)} won</button><button class="ok" data-win="${m.id}|b">${esc(m.b.name)} won</button></div>`;
  if(play&&isHost()&&!clash)x+=`${ra&&rb?`<div class="mute">Both teams agree on ${ra.a}-${ra.b}. Confirm the winner:</div>`:""}<div class="row"><button class="g" data-win="${m.id}|a">${esc(m.a.name)} won</button><button class="g" data-win="${m.id}|b">${esc(m.b.name)} won</button></div>`;
  
  const tr=[m.a,m.b].filter(t=>t&&rep[t.id]).map(t=>`<div class="mute">${esc(t.name)} reported ${rep[t.id].a}-${rep[t.id].b} (${esc(rep[t.id].ocr)})</div>`).join("");
  return `<div class="m">${row("a")}${row("b")}${tr}${x}</div>`;}

async function start(){
  const ok=approved().map(t=>({id:t.id,name:t.name}));
  if(ok.length<2){$("er2").textContent="Approve at least 2 teams first.";return}
  if(T.fmt==="br"){await updateDoc(tdoc(),{status:"live"});return}
  for(let i=ok.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ok[i],ok[j]]=[ok[j],ok[i]]}
  let size=2;while(size<ok.length)size*=2;const seeds=ok.concat(Array(size-ok.length).fill(null)),Rn=Math.log2(size),rounds=[];
  rounds.push(Array.from({length:size/2},(_,i)=>({r:0,i,a:seeds[i],b:seeds[size-1-i],reports:{},winner:null})));
  for(let r=1;r<Rn;r++)rounds.push(Array.from({length:size/2**(r+1)},(_,i)=>({r,i,a:null,b:null,reports:{},winner:null})));
  rounds[0].forEach(m=>{if(!m.a||!m.b){m.bye=true;m.winner=m.a?"a":"b";const nx=rounds[1]?.[Math.floor(m.i/2)];if(nx)nx[m.i%2===0?"a":"b"]=m[m.winner]}});
  const b=writeBatch(db);rounds.flat().forEach(m=>b.set(tdoc("matches",`r${m.r}_${m.i}`),{...m,a:m.a??null,b:m.b??null,bye:!!m.bye}));
  b.update(tdoc(),{status:"live",rounds:Rn});await b.commit();}

async function report(id){
  const m=matches.find(x=>x.id===id),a=parseInt($("a_"+id).value),b=parseInt($("b_"+id).value);
  if(isNaN(a)||isNaN(b)||a===b){alert("Enter both scores. A tie is not allowed.");return}
  const names=[m.a,m.b].flatMap(t=>teams.find(x=>x.id===t.id)?.usernames||[]);
  let ocr;try{ocr=await scan($("f_"+id).files[0],names)}catch(e){ocr="screenshot could not be read"}
  await updateDoc(tdoc("matches",id),{["reports."+user.uid]:{a,b,ocr}});
}

async function resolve(m,side){const w=m[side];
  await updateDoc(tdoc("matches",m.id),{winner:side});
  if(m.r+1>=T.rounds){if(isOwner())await finishKO(w,m[side==="a"?"b":"a"])}
  else await updateDoc(tdoc("matches",`r${m.r+1}_${Math.floor(m.i/2)}`),{[m.i%2===0?"a":"b"]:w});}

async function finishKO(w,l){const pr=GAMES[T.game]?.prizes||[0,0,0];
  if(pr[0]+(l?pr[1]:0)>pool()){alert("The prizes add up to more than the money collected. Check the entries or lower the prizes.");return}
  const b=writeBatch(db);b.update(tdoc(),{status:"done",champion:w.name});
  b.set(tdoc("payouts",w.id),{team:w.name,amount:pr[0],place:1,paid:false});
  if(l&&pr[1]>0)b.set(tdoc("payouts",l.id),{team:l.name,amount:pr[1],place:2,paid:false});
  await b.commit();}

/* ---------- Battle royale ---------- */
function standings(){const S={};approved().forEach(t=>S[t.id]={id:t.id,name:t.name,pts:0,kills:0});
  results.filter(r=>r.ok).forEach(r=>{const s=S[r.tid];if(s){s.pts+=(PLACE_POINTS[r.place-1]||0)+r.kills;s.kills+=r.kills}});
  return Object.values(S).sort((a,b)=>b.pts-a.pts||b.kills-a.kills);}
function brView(mine){const st=standings();let h=`<div class="card"><h2>Leaderboard</h2><table><tr><th>#</th><th>Team</th><th>Kills</th><th>Points</th></tr>`+
  st.map((s,i)=>`<tr><td>${i+1}</td><td>${esc(s.name)}</td><td>${s.kills}</td><td>${s.pts}</td></tr>`).join("")+`</table></div>`;
  if(T.status==="live"&&mine?.status==="approved")h+=`<div class="card"><h2>Submit your match result</h2><div class="row">
  <select id="bg" style="width:auto">${Array.from({length:T.games},(_,i)=>`<option value="${i+1}">Match ${i+1}</option>`).join("")}</select>
  <input id="bp" type="number" min="1" placeholder="Placement" style="width:120px"><input id="bk2" type="number" min="0" placeholder="Total kills" style="width:120px"></div>
  <div class="row"><input id="bf" type="file" accept="image/*"><button id="brs">Submit</button></div><p class="mute">Upload the result screenshot. The host approves it before points count.</p></div>`;
  h+=`<div class="card"><h2>All submitted results</h2>`+(results.length?`<table><tr><th>Team</th><th>Match</th><th>Place</th><th>Kills</th><th>Status</th></tr>`+results.map(r=>`<tr><td>${esc(r.tname)}</td><td>${r.g}</td><td>${r.place}</td><td>${r.kills}</td><td>${r.ok?"approved":r.rejected?"rejected":"waiting"}</td></tr>`).join("")+`</table>`:`<p class="mute">Nothing submitted yet.</p>`)+`</div>`;
  const pend=results.filter(r=>!r.ok&&!r.rejected);
  if(isHost()&&T.status==="live"){h+=`<div class="card"><h2>Results to approve</h2>`+(pend.length?pend.map(r=>`<div class="item"><div><strong>${esc(r.tname)}</strong> | Match ${r.g}<br><span class="mute">Place ${r.place}, kills ${r.kills} | ${esc(r.ocr)}</span></div>
    <div class="row" style="margin:0"><button class="ok" data-ok="${r.id}">Approve</button><button class="g" data-no="${r.id}">Reject</button></div></div>`).join(""):`<p class="mute">Nothing waiting.</p>`)+
    (isOwner()?`<div class="row"><button id="fin">Finish tournament and work out prizes</button></div>`:"")+`</div>`}
  return h;}
async function submitBR(){
  const place=parseInt($("bp").value),kills=parseInt($("bk2").value),g=+$("bg").value,t=teams.find(x=>x.id===user.uid);
  if(isNaN(place)||isNaN(kills)||place<1){alert("Enter your placement and kills.");return}
  let ocr;try{ocr=await scan($("bf").files[0],t.usernames)}catch(e){ocr="screenshot could not be read"}
  await setDoc(tdoc("results",`${g}_${user.uid}`),{g,tid:user.uid,tname:t.name,place,kills,ocr,ok:false});}
async function finishBR(){const st=standings(),pr=GAMES[T.game]?.prizes||[0,0,0],b=writeBatch(db);
  if(pr.slice(0,st.length).reduce((x,y)=>x+y,0)>pool()){alert("The prizes add up to more than the money collected.");return}
  pr.forEach((amt,i)=>{if(st[i]&&amt>0)b.set(tdoc("payouts",st[i].id),{team:st[i].name,amount:amt,place:i+1,paid:false})});
  b.update(tdoc(),{status:"done",champion:st[0]?.name||""});await b.commit();}

/* ---------- Payout list ---------- */
function payView(){return `<div class="card"><h2>Prizes</h2>`+(payouts.length?payouts.map(p=>{const t=teams.find(x=>x.id===p.id);
  return `<div class="item"><div><strong>${esc(p.team)}</strong> ${p.paid?'<span class="tag approved">paid</span>':'<span class="tag pending">to pay</span>'}<br>
  <span class="mute">${p.amount} naira${isOwner()&&t?" | send to "+esc(t.captain)+": "+esc(pv(t.id).payout):""}</span>${isOwner()&&!p.paid?`<div class="row"><input id="vt_${p.id}" placeholder="Captain's ticket code" style="width:180px"><button class="g" data-vt="${p.id}">Check ticket</button></div>`:""}</div>
  ${isOwner()&&!p.paid?`<button class="ok" data-paid="${p.id}">Mark paid</button>`:""}</div>`}).join(""):`<p class="mute">No prizes.</p>`)+`</div>`;}
</script>
